name: Deploy Company Hub API to Azure App Service

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          node --check app.js
          node --check api_server.js
          npm test --if-present

      - name: Create deployment package
        run: |
          tar --exclude='./data/company_hub.db' \
              --exclude='./node_modules' \
              --exclude='./.git' \
              -czf company-hub.tar.gz .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: company-hub.tar.gz
